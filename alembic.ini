# Alembic configuration for the code_navi application database.
#
# Keep this file pure ASCII: configparser reads it with the system locale
# encoding, which is not UTF-8 on every platform.
#
# The database URL is deliberately NOT set here. migrations/env.py reads it
# from code_navi.db so there is exactly one source of truth, and no credentials
# ever land in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
