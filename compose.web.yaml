name: code-navi-web

# Code Navi — current NAS web stack.
#
#   docker compose -f compose.web.yaml up -d --build
#
# Entry: https://91666.icu:25000
# Caddy uses the existing certificate mounted from the NAS host and requires
# BASIC_AUTH_USER / BASIC_AUTH_HASH from the deployment environment.
#
# Data layout — one named volume keeps the app usable across rebuilds:
#   /data/code-navi.db   SQLite database      (CODE_NAVI_DATABASE_URL)
#   /data/provider.env   provider credentials (loaded by the backend on start)
#   /data/runs/          Kernel event logs     (CODE_NAVI_EVENTS_DIR)
#
# Provider config: copy an existing .code-navi/provider.env into the volume
# once, e.g. `docker compose -f compose.web.yaml cp .code-navi/provider.env
# backend:/data/provider.env`, then restart the backend.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: code-navi-backend:local
    restart: unless-stopped
    environment:
      CODE_NAVI_DATABASE_URL: sqlite:////data/code-navi.db
      CODE_NAVI_DATA_DIR: /data
      CODE_NAVI_EVENTS_DIR: /data/runs
      CODE_NAVI_CORS_ORIGINS: "https://91666.icu:25000,https://192.168.0.2:25000,http://192.168.0.2:25000,https://localhost:25000,http://localhost:25000,https://127.0.0.1:25000,http://127.0.0.1:25000"
      CODE_NAVI_COOKIE_SECURE: "1"
      CODE_NAVI_ENV: "production"
    volumes:
      - code_navi_data:/data
    expose:
      - "8000"          # reachable only via Caddy on the same network
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code-navi-frontend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"          # reachable only via Caddy
    depends_on:
      - backend
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "25000:25000"   # HTTPS entry — https://91666.icu:25000 / https://192.168.0.2:25000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Existing TLS certificate on the NAS host (read-only).
      # Host files: 91666.icu.pem + 91666.icu.key -> /certs
      - /vol4/docker/xray/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - web

volumes:
  code_navi_data:       # SQLite DB + provider config + event logs
  caddy_data:           # Caddy TLS certificates & autosave
  caddy_config:         # Caddy runtime config

networks:
  web:
