name: code-navi-web

# Code Navi — current NAS web stack.
#
#   docker compose -f compose.web.yaml up -d --build
#
# Entry: https://91666.icu:25000
# Caddy uses the existing certificate mounted from the NAS host and requires
# BASIC_AUTH_USER / BASIC_AUTH_HASH from the deployment environment.
#
# Data layout — one named volume keeps the app usable across rebuilds:
#   /data/code-navi.db   SQLite database      (CODE_NAVI_DATABASE_URL)
#   /data/provider.env   provider credentials (loaded by the backend on start)
#   /data/runs/          Kernel event logs     (CODE_NAVI_EVENTS_DIR)
#
# Provider config: copy an existing .code-navi/provider.env into the volume
# once, e.g. `docker compose -f compose.web.yaml cp .code-navi/provider.env
# backend:/data/provider.env`, then restart the backend.

services:
  piston:
    # Code execution service for the practice module. Same pinned digest and
    # limits as compose.yaml; exposed only inside this Compose network — the
    # browser never reaches Piston directly.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    privileged: true
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "64"
      PISTON_MAX_FILE_SIZE: "1048576"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_CONCURRENT_JOBS: "4"
      PISTON_COMPILE_TIMEOUT: "2000"
      PISTON_RUN_TIMEOUT: "2000"
      PISTON_COMPILE_CPU_TIME: "2000"
      PISTON_RUN_CPU_TIME: "2000"
      PISTON_COMPILE_MEMORY_LIMIT: "134217728"
      PISTON_RUN_MEMORY_LIMIT: "134217728"
    expose:
      - "2000"
    volumes:
      - type: volume
        source: piston_packages
        target: /piston/packages
    tmpfs:
      - /tmp:exec,nosuid,size=256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:2000/api/v2/runtimes',
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - web

  compiler-runtime-setup:
    # One-shot: wait for Piston, install the pinned Python runtime, verify.
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: code-navi-backend:local
    environment:
      PISTON_BASE_URL: http://piston:2000
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
    entrypoint: []
    command: ["python", "-m", "code_navi.online_compiler.runtime_setup"]
    depends_on:
      piston:
        condition: service_healthy
    restart: "no"
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: code-navi-backend:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CODE_NAVI_DATABASE_URL: sqlite:////data/code-navi.db
      CODE_NAVI_DATA_DIR: /data
      CODE_NAVI_EVENTS_DIR: /data/runs
      CODE_NAVI_CORS_ORIGINS: "https://91666.icu:25000,https://192.168.0.2:25000,http://192.168.0.2:25000,https://localhost:25000,http://localhost:25000,https://127.0.0.1:25000,http://127.0.0.1:25000"
      CODE_NAVI_COOKIE_SECURE: "1"
      CODE_NAVI_ENV: "production"
      PISTON_BASE_URL: ${PISTON_BASE_URL:-http://piston:2000}
    volumes:
      - code_navi_data:/data
    expose:
      - "8000"          # reachable only via Caddy on the same network
    depends_on:
      compiler-runtime-setup:
        condition: service_completed_successfully
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code-navi-frontend:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
    expose:
      - "3000"          # reachable only via Caddy
    depends_on:
      - backend
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "25000:25000"   # HTTPS entry — https://91666.icu:25000 / https://192.168.0.2:25000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Existing TLS certificate on the NAS host (read-only).
      # Host files: 91666.icu.pem + 91666.icu.key -> /certs
      - /vol4/docker/xray/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - web

volumes:
  code_navi_data:       # SQLite DB + provider config + event logs
  caddy_data:           # Caddy TLS certificates & autosave
  caddy_config:         # Caddy runtime config
  piston_packages:
    # Adopts an existing `piston_packages` volume when the host already has one
    # (e.g. an earlier Piston run); created fresh on first deploy.
    name: piston_packages

networks:
  web:
