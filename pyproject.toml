[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-navi-agent-kernel"
version = "0.1.0"
description = "A small, platform-agnostic single-agent runtime kernel"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
