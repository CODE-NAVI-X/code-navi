[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-navi"
version = "0.1.0"
description = "Code Navi application for learning, teaching, and research assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
code-navi = "code_navi.cli:main"

[project.optional-dependencies]
online = [
    "openai>=2.44,<3",
]
dev = [
    "build>=1.3,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that call a real external provider",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
