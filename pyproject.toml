[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-navi"
version = "0.1.0"
description = "Code Navi application for learning, teaching, and research assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
code-navi = "code_navi.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "openai>=2.44,<3",
    "python-docx>=1.1,<2",
    "latex2mathml>=3.76,<4",
    "lxml>=5,<7",
    "pypdf>=6,<7",
]
online = [
    "openai>=1.0,<3",
]
dev = [
    "build>=1.3,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    # Needed by the offline (--no-isolation) wheel-build regression test that
    # verifies package-data (MML2OMML.XSL) is actually shipped in the wheel.
    "setuptools>=75",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"code_navi.research" = ["skills/*/SKILL.md"]
"code_navi.learning.quiz" = ["MML2OMML.XSL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that call a real external provider or local execution service",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
