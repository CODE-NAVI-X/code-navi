services:
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - type: volume
        source: piston_packages
        target: /piston/packages
    tmpfs:
      - /tmp:exec,nosuid,size=256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:2000/api/v2/runtimes',
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  compiler-runtime-setup:
    build:
      context: .
    image: code-navi:local
    environment:
      PISTON_BASE_URL: http://piston:2000
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
    entrypoint: []
    command: ["python", "-m", "code_navi.online_compiler.runtime_setup"]
    depends_on:
      piston:
        condition: service_healthy
    restart: "no"

  code-navi:
    build:
      context: .
    image: code-navi:local
    init: true
    stdin_open: true
    tty: true
    read_only: true
    environment:
      CODE_NAVI_PROVIDER: ${CODE_NAVI_PROVIDER:-mock}
      CODE_NAVI_MODEL: ${CODE_NAVI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PISTON_BASE_URL: http://piston:2000
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
      COMPILER_DATABASE_PATH: /data/compiler-learning-records.sqlite3
      COMPILER_AI_PROVIDER: ${COMPILER_AI_PROVIDER:-openai}
      COMPILER_AI_MODEL: ${COMPILER_AI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: code_navi_runs
        target: /data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      compiler-runtime-setup:
        condition: service_completed_successfully

volumes:
  code_navi_runs:
  piston_packages:
